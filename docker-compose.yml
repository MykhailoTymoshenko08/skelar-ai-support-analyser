services:
  app: &base
    build: .
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    working_dir: /app
    environment:
      - PYTHONPATH=/app

  generate:
    <<: *base
    command: >
      sh -c "rm -f data/chats.json &&
             python src/generate.py"

  analyze:
    <<: *base
    command: >
      sh -c "rm -f data/analysis_results.json &&
             python src/analyze.py"

  all:
    <<: *base
    command: >
      sh -c "rm -f data/chats.json data/analysis_results.json &&
             python src/generate.py &&
             python src/analyze.py"