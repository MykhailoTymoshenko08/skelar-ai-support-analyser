services:
  app:
    build: .
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    command: >
      sh -c "rm -f data/chats.json data/analysis_results.json &&
            python src/generate.py &&
            python src/analyze.py"
